# BCT Regulatory Search behind the server's Nginx.
# Red Hat: copy to /etc/nginx/conf.d/, check with `nginx -t`, then `systemctl reload nginx`.
#
# The app container listens on 127.0.0.1:8080 only (docker-compose.yml), so Nginx is the one
# way in. Change server_name and the two certificate paths to the real ones.

upstream bct_regulatory_search {
    server 127.0.0.1:8080;
}

# Plain HTTP only redirects to HTTPS.
server {
    listen 80;
    server_name recherche.bct.tn;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" works on every Nginx Red Hat ships (1.20+); newer ones prefer "http2 on;".
    listen 443 ssl http2;
    server_name recherche.bct.tn;

    ssl_certificate     /etc/pki/tls/certs/recherche.bct.tn.crt;
    ssl_certificate_key /etc/pki/tls/private/recherche.bct.tn.key;

    # PDF uploads up to 50 MB, the app's own limit. Nginx's default (1 MB) refuses most PDFs
    # with "413 Request Entity Too Large".
    client_max_body_size 50m;

    location / {
        proxy_pass http://bct_regulatory_search;
        proxy_http_version 1.1;

        # The user's real address: the app limits failed logins per address, and without
        # these every user would share Nginx's address (one locked out = everyone locked out).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An answer can take 1-2 minutes on a server without a GPU. Nginx's default (60 s)
        # would cut it with "504 Gateway Timeout".
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Uploads go straight to the app instead of being written to Nginx's disk first.
        proxy_request_buffering off;
    }
}
