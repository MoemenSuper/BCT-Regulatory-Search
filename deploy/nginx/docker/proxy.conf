# What every server block of the bundled Nginx does: pass everything to the app container.
# Same settings, and same reasons, as ../bct-regulatory-search.conf (the file for a server's own
# Nginx): change one, change the other.

# PDF uploads up to 50 MB, the app's own limit (Nginx's default, 1 MB, refuses most PDFs).
client_max_body_size 50m;

location / {
    proxy_pass http://app:8000;
    proxy_http_version 1.1;

    # The user's real address: the app limits failed logins per address.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # An answer can take 1-2 minutes on a server without a GPU (Nginx's default is 60 s).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Uploads go straight to the app instead of being written to Nginx's disk first.
    proxy_request_buffering off;
}
