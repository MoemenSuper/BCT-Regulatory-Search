# Bundled Nginx with a certificate (deploy/nginx/certs/bct.crt and bct.key): HTTPS, and plain
# HTTP only redirects to it.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/bct.crt;
    ssl_certificate_key /etc/nginx/certs/bct.key;

    include /etc/nginx/bct/proxy.conf;
}
