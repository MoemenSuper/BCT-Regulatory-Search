services:
  neo4j:
    image: neo4j:2026.07.1
    container_name: bct-graph-lite
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${BCT_NEO4J_PASSWORD:-bct-graph-lite-verify}"
    volumes:
      - ./.neo4j-data:/data
