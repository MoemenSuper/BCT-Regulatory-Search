# One-command pilot: web app + API.
#
# 1. cp .env.example .env   and fill the required values
# 2. Ensure ./documents exists (PDF corpus) before the first build
# 3. docker compose up -d --build
# 4. open http://localhost:8080
#
# PDFs are copied into the image at /data/documents. No host mount needed.
# Optional override: set BCT_DOCUMENTS_HOST and uncomment the bind mount below.

services:
  app:
    build: .
    image: bct-regulatory-search:pilot
    container_name: bct-regulatory-search
    restart: unless-stopped
    ports:
      - "${BCT_PUBLISH_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      BCT_ASSETS_DIR: /data/assets
      BCT_DOCUMENTS_DIR: /data/documents
      BCT_DATA_DIR: /data/state
      BCT_STATIC_DIR: /app/static
      BCT_INGEST_LOCAL_INDEX: "0"
      BCT_DEFAULT_PROFILE: cloud
    volumes:
      - bct-assets:/data/assets
      # - ${BCT_DOCUMENTS_HOST}:/data/documents:ro
      - bct-app-data:/data/state

volumes:
  bct-assets:
  bct-app-data:
