# One-command pilot: web app + API.
#
# 1. cp .env.example .env   and fill the required values
# 2. Ensure ./documents and ./baked-runtime-assets exist before build
#    (refresh the corpus with: python backend/bake_assets.py --source <live asset root>)
# 3. docker compose up -d --build
#    or, on a server with no Nginx of its own: docker compose --profile nginx up -d --build
# 4. open http://localhost:8080 (or the server's address with the bundled Nginx)
#
# PDFs and local Chroma indexes are baked into the image. On first boot the empty
# bct-assets volume is seeded from /opt/bct/baked-assets so search works
# without re-uploading ~400 PDFs.

services:
  app:
    build: .
    image: bct-regulatory-search:pilot
    container_name: bct-regulatory-search
    restart: unless-stopped
    # Published on this machine only (127.0.0.1): users come in through Nginx
    # (deploy/nginx/bct-regulatory-search.conf), or a browser on the same machine. Set
    # BCT_PUBLISH_ADDRESS=0.0.0.0 in .env to open the port to the network without Nginx.
    ports:
      - "${BCT_PUBLISH_ADDRESS:-127.0.0.1}:${BCT_PUBLISH_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      BCT_ASSETS_DIR: /data/assets
      BCT_BAKED_ASSETS_DIR: /opt/bct/baked-assets
      BCT_DOCUMENTS_DIR: /data/documents
      BCT_DATA_DIR: /data/state
      BCT_STATIC_DIR: /app/static
      BCT_INGEST_LOCAL_INDEX: "1"
      BCT_DEFAULT_PROFILE: local_hybrid
      # Trust the client address Nginx forwards (X-Forwarded-For). Safe because only this
      # machine can reach the port; failed-login limits then apply per user, not to Nginx.
      FORWARDED_ALLOW_IPS: "*"

    volumes:
      - bct-assets:/data/assets
      # - ${BCT_DOCUMENTS_HOST}:/data/documents:ro
      - bct-app-data:/data/state

  # A server with no Nginx of its own: `--profile nginx` starts this one in front of the app.
  # HTTPS when deploy/nginx/certs holds bct.crt and bct.key, plain HTTP otherwise (start.sh).
  # Without --profile nginx it does not start (the server's own Nginx uses
  # deploy/nginx/bct-regulatory-search.conf instead). ",z" lets SELinux (Red Hat) read the files.
  nginx:
    image: nginx:1.30-alpine
    container_name: bct-nginx
    profiles: [nginx]
    restart: unless-stopped
    depends_on: [app]
    command: ["/bin/sh", "/etc/nginx/bct/start.sh"]
    ports:
      - "${BCT_HTTP_PORT:-80}:80"
      - "${BCT_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/docker:/etc/nginx/bct:ro,z
      - ./deploy/nginx/certs:/etc/nginx/certs:ro,z

volumes:
  bct-assets:
  bct-app-data:
