# One-command pilot: web app + Graph Lite (Neo4j).
#
# 1. cp .env.example .env   and fill the required values
# 2. docker compose up -d --build
# 3. open http://localhost:8080

services:
  neo4j:
    image: neo4j:2026.07.1
    container_name: bct-graph-lite
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${BCT_NEO4J_PASSWORD:?Set BCT_NEO4J_PASSWORD in .env}"
    volumes:
      - bct-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    build: .
    image: bct-regulatory-search:pilot
    container_name: bct-regulatory-search
    restart: unless-stopped
    ports:
      - "${BCT_PUBLISH_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      BCT_ASSETS_DIR: /data/assets
      BCT_DOCUMENTS_DIR: /data/documents
      BCT_DATA_DIR: /data/state
      BCT_STATIC_DIR: /app/static
      BCT_NEO4J_URI: bolt://neo4j:7687
      BCT_NEO4J_USERNAME: neo4j
      BCT_ENABLE_GRAPH: "1"
      BCT_INGEST_GRAPH: "1"
      BCT_INGEST_LOCAL_INDEX: "0"
      BCT_DEFAULT_PROFILE: cloud
    volumes:
      - bct-assets:/data/assets
      - ${BCT_DOCUMENTS_HOST:?Set BCT_DOCUMENTS_HOST in .env to your PDF folder}:/data/documents:ro
      - bct-app-data:/data/state
    depends_on:
      neo4j:
        condition: service_started

volumes:
  bct-assets:
  bct-app-data:
  bct-neo4j-data:
